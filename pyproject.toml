[project]
name = "lecturelens"
version = "0.1.0"
description = "Multimodal lecture video understanding with classical speech, vision, text and biosignal processing"
readme = "README.md"
authors = [
    { name = "sathwik-arionix", email = "sathwik.bodakuntla@arionix.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "matplotlib>=3.11.2",
    "mediapipe>=1.2.3",
    "nltk>=3.10.4",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "pytesseract>=0.3.13",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "streamlit>=1.67.0",
    "tiktoken>=0.14.0",
    "yt-dlp>=2026.10.26",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "librosa>=1.0.1",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "python-pptx>=1.0.2",
    "rank-bm25>=0.2.2",
]
